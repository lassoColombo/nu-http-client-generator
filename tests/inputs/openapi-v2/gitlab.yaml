        - in: 'query'
          name: 'per_page'
          description: 'Number of items per page'
          type: 'integer'
          format: 'int32'
          default: 20
          required: false
          example: 20
        - in: 'path'
          name: 'id'
          type: 'integer'
          format: 'int32'
          required: true
        - in: 'path'
          name: 'epic_iid'
          type: 'integer'
          format: 'int32'
          required: true
        - in: 'path'
          name: 'note_id'
          type: 'integer'
          format: 'int32'
          required: true
      responses:
        '200':
          description: 'List an awardable''s emoji reactions for groups'
          schema:
            type: 'array'
            items:
              '$ref': '#/definitions/API_Entities_AwardEmoji'
        '404':
          description: 'Not Found'
      tags:
        - 'award_emoji'
      operationId: 'getApiV4GroupsIdEpicsEpicIidNotesNoteIdAwardEmoji'
    post:
      summary: 'Add a new emoji reaction'
      description: 'Add an emoji reaction on the specified awardable. This feature was introduced in 8.9'
      produces:
        - 'application/json'
      consumes:
        - 'application/json'
      parameters:
        - in: 'path'
          name: 'id'
          type: 'integer'
          format: 'int32'
          required: true
        - in: 'path'
          name: 'epic_iid'
          type: 'integer'
          format: 'int32'
          required: true
        - in: 'path'
          name: 'note_id'
          type: 'integer'
          format: 'int32'
          required: true
        - name: 'postApiV4GroupsIdEpicsEpicIidNotesNoteIdAwardEmoji'
          in: 'body'
          required: true
          schema:
            '$ref': '#/definitions/postApiV4GroupsIdEpicsEpicIidNotesNoteIdAwardEmoji'
      responses:
        '201':
          description: 'Add a new emoji reaction'
          schema:
            '$ref': '#/definitions/API_Entities_AwardEmoji'
        '400':
