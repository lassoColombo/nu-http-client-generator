openapi: 3.0.3
info:
  title: Ref Resolution Edge Cases
  version: 1.0.0
  description: >-
    Synthetic spec exercising $ref resolution: self-referential (circular)
    schemas must terminate, multi-hop $ref chains collapse, allOf with a $ref
    base merges, shared #/components/parameters refs resolve, and a JSON
    Pointer into a schema resolves to that property rather than to a
    top-level schema sharing the last segment's name. Also: a response given
    as a $ref into #/components/responses resolves (return type + Accept), a
    percent-encoded JSON Pointer (`%7B`/`%7D`, the openSUSE OBS shape) walks
    the document, and an AWS-style `allOf: [{$ref: Scalar}, {description}]`
    property wrapper yields the member's type plus the description — in body
    fields and in the response type alike.
servers:
  - url: https://api.example.com
components:
  responses:
    PetResponse:
      description: A pet
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Pet'}
  parameters:
    PageParam:
      name: page
      in: query
      schema: {type: integer}
      description: Page number (shared parameter ref).
  schemas:
    # Self-referential: a tree node references itself.
    TreeNode:
      type: object
      properties:
        value: {type: string}
        children:
          type: array
          items: {$ref: '#/components/schemas/TreeNode'}
    # $ref chain: AliasA -> AliasB -> Concrete.
    AliasA: {$ref: '#/components/schemas/AliasB'}
    AliasB: {$ref: '#/components/schemas/Concrete'}
    Concrete:
      type: object
      required: [name]
      properties:
        name: {type: string}
        count: {type: integer}
    # Decoy: shares its name with `Pet.properties.status`. The pointer
    # `#/components/schemas/Pet/properties/status` must NOT land here.
    status: {type: string, enum: [decoy]}
    Pet:
      type: object
      properties:
        status: {type: string, enum: [available, sold]}
    # AWS shapes: scalar/list schemas referenced through allOf wrappers.
    Date: {type: string, format: date-time}
    ClusterStateList:
      type: array
      items: {type: string}
    ListClustersInput:
      type: object
      required: [CreatedAfter]
      properties:
        CreatedAfter:
          allOf:
            - {$ref: '#/components/schemas/Date'}
            - description: The creation date and time beginning value filter.
        ClusterStates:
          allOf:
            - {$ref: '#/components/schemas/ClusterStateList'}
            - description: The cluster state filters to apply.
    ListClustersOutput:
      type: object
      properties:
        Clusters:
          allOf:
            - {$ref: '#/components/schemas/ClusterStateList'}
            - description: The list of clusters.
        Marker:
          allOf:
            - {$ref: '#/components/schemas/Date'}
            - description: Pagination token.
paths:
  # Body is a self-referential schema -> generation must terminate.
  /trees:
    post:
      operationId: createTree
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TreeNode'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeNode'}
  # Body via a multi-hop alias chain; query param via shared component ref.
  /aliased:
    get:
      operationId: getAliased
      parameters:
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AliasA'}
    post:
      operationId: createAliased
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AliasA'}
      responses:
        '200': {description: ok}
  # Query param whose schema is a pointer INTO a schema.
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/Pet/properties/status'}
      responses:
        '200': {description: ok}
  # Response is a $ref into #/components/responses -> resolved to Pet.
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/PetResponse'}
  # Parameter ref with a percent-encoded pointer into the op above.
  /pets/{petId}/photos:
    get:
      operationId: listPetPhotos
      parameters:
        - $ref: '#/paths/~1pets~1%7BpetId%7D/get/parameters/0'
      responses:
        '200': {description: ok}
  # AWS allOf wrappers in the body fields and the response type.
  /clusters:
    post:
      operationId: listClusters
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListClustersInput'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListClustersOutput'}
