openapi: 3.0.3
info:
  title: Ref Resolution Edge Cases
  version: 1.0.0
  description: >-
    Synthetic spec exercising $ref resolution: self-referential (circular)
    schemas must terminate, multi-hop $ref chains collapse, allOf with a $ref
    base merges, shared #/components/parameters refs resolve, and a JSON
    Pointer into a schema resolves to that property rather than to a
    top-level schema sharing the last segment's name. Also: a response given
    as a $ref into #/components/responses resolves (return type + Accept), a
    percent-encoded JSON Pointer (`%7B`/`%7D`, the openSUSE OBS shape) walks
    the document, and an AWS-style `allOf: [{$ref: Scalar}, {description}]`
    property wrapper yields the member's type plus the description — in body
    fields and in the response type alike. A two-level allOf chain (an
    allOf-only wrapper whose member is itself allOf) surfaces the leaf's
    fields as body flags, and a response given as a $ref still contributes
    its schema's discriminator. A SIX-level allOf-only chain (deeper than
    the old depth cap of three) still reaches the leaf, and a discriminator
    declared only on a `201` next to a plain `200` is still documented.
servers:
  - url: https://api.example.com
components:
  responses:
    PetResponse:
      description: A pet
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Pet'}
    KindedPetResponse:
      description: A pet with a discriminator, behind a response ref
      content:
        application/json:
          schema: {$ref: '#/components/schemas/KindedPet'}
  parameters:
    PageParam:
      name: page
      in: query
      schema: {type: integer}
      description: Page number (shared parameter ref).
  schemas:
    # Two-level allOf chain: Outer -> Mid -> Leaf, every level allOf-only
    # except the leaf. Body flags and the response type must both carry
    # leaf_field, mid_field and outer_field.
    Leaf:
      type: object
      properties:
        leaf_field: {type: string}
      required: [leaf_field]
    Mid:
      allOf:
        - {$ref: '#/components/schemas/Leaf'}
        - type: object
          properties:
            mid_field: {type: integer}
    Outer:
      allOf:
        - {$ref: '#/components/schemas/Mid'}
        - type: object
          properties:
            outer_field: {type: boolean}
    # Six-level allOf-only chain: D0 -> D1 -> ... -> D5, only the last has
    # properties. `deep_field` must surface as a required body positional and
    # in the response type.
    D0: {allOf: [{$ref: '#/components/schemas/D1'}]}
    D1: {allOf: [{$ref: '#/components/schemas/D2'}]}
    D2: {allOf: [{$ref: '#/components/schemas/D3'}]}
    D3: {allOf: [{$ref: '#/components/schemas/D4'}]}
    D4: {allOf: [{$ref: '#/components/schemas/D5'}]}
    D5:
      type: object
      properties:
        deep_field: {type: string}
      required: [deep_field]
    KindedPet:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Pet'
          dog: '#/components/schemas/Pet'
      properties:
        kind: {type: string}
    # Self-referential: a tree node references itself.
    TreeNode:
      type: object
      properties:
        value: {type: string}
        children:
          type: array
          items: {$ref: '#/components/schemas/TreeNode'}
    # $ref chain: AliasA -> AliasB -> Concrete.
    AliasA: {$ref: '#/components/schemas/AliasB'}
    AliasB: {$ref: '#/components/schemas/Concrete'}
    Concrete:
      type: object
      required: [name]
      properties:
        name: {type: string}
        count: {type: integer}
    # Decoy: shares its name with `Pet.properties.status`. The pointer
    # `#/components/schemas/Pet/properties/status` must NOT land here.
    status: {type: string, enum: [decoy]}
    Pet:
      type: object
      properties:
        status: {type: string, enum: [available, sold]}
    # AWS shapes: scalar/list schemas referenced through allOf wrappers.
    Date: {type: string, format: date-time}
    ClusterStateList:
      type: array
      items: {type: string}
    ListClustersInput:
      type: object
      required: [CreatedAfter]
      properties:
        CreatedAfter:
          allOf:
            - {$ref: '#/components/schemas/Date'}
            - description: The creation date and time beginning value filter.
        ClusterStates:
          allOf:
            - {$ref: '#/components/schemas/ClusterStateList'}
            - description: The cluster state filters to apply.
    ListClustersOutput:
      type: object
      properties:
        Clusters:
          allOf:
            - {$ref: '#/components/schemas/ClusterStateList'}
            - description: The list of clusters.
        Marker:
          allOf:
            - {$ref: '#/components/schemas/Date'}
            - description: Pagination token.
paths:
  # Body is a self-referential schema -> generation must terminate.
  /trees:
    post:
      operationId: createTree
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TreeNode'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeNode'}
  # Body via a multi-hop alias chain; query param via shared component ref.
  /aliased:
    get:
      operationId: getAliased
      parameters:
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AliasA'}
    post:
      operationId: createAliased
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AliasA'}
      responses:
        '200': {description: ok}
  # Query param whose schema is a pointer INTO a schema.
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/Pet/properties/status'}
      responses:
        '200': {description: ok}
  # Response is a $ref into #/components/responses -> resolved to Pet.
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/PetResponse'}
  # Parameter ref with a percent-encoded pointer into the op above.
  /pets/{petId}/photos:
    get:
      operationId: listPetPhotos
      parameters:
        - $ref: '#/paths/~1pets~1%7BpetId%7D/get/parameters/0'
      responses:
        '200': {description: ok}
  # AWS allOf wrappers in the body fields and the response type.
  /clusters:
    post:
      operationId: listClusters
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListClustersInput'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListClustersOutput'}
  # Two-level allOf chain in the body and the response.
  /outer:
    post:
      operationId: createOuter
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Outer'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Outer'}
  # Response $ref whose schema carries a discriminator.
  /kinded:
    get:
      operationId: getKinded
      responses:
        '200': {$ref: '#/components/responses/KindedPetResponse'}
  # Six-level allOf-only chain in the body and the response.
  /deep:
    post:
      operationId: createDeep
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/D0'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/D0'}
  # Discriminator only on the 201; the 200 (the return type) has none.
  /kinded-created:
    post:
      operationId: createKinded
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: object, properties: {id: {type: string}}}
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KindedPet'}
