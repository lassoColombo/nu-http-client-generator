openapi: 3.0.3
info:
  title: flag-name-edge-cases
  version: 1.0.0
  description: Synthetic spec exercising flag-name sanitization edge cases.
servers:
  - url: https://example.com
paths:
  /widgets:
    get:
      operationId: widgets_list
      tags:
        - widgets
      parameters:
        - name: Notion-Version
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: XCustomHeader
          in: header
          required: false
          schema:
            type: string
        - name: "{field-name}"
          in: query
          required: false
          schema:
            type: string
        # Common param names that nushell accepts as flags unchanged: builtin
        # command names and keywords are not reserved variable names.
        - name: sort
          in: query
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
        - name: if
          in: query
          schema: {type: string}
        - name: "null"
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
