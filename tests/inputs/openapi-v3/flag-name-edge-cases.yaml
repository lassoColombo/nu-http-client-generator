openapi: 3.0.3
info:
  title: flag-name-edge-cases
  version: 1.0.0
  description: Synthetic spec exercising flag-name sanitization edge cases.
servers:
  - url: https://example.com
paths:
  /widgets:
    get:
      operationId: widgets_list
      tags:
        - widgets
      parameters:
        - name: Notion-Version
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: XCustomHeader
          in: header
          required: false
          schema:
            type: string
        # Array header/cookie whose items are a `$ref`: no primitive item type,
        # but still a list, so it is comma-joined (nushell drops a list value
        # from `--headers` without a word).
        - name: X-Ids
          in: header
          schema: {type: array, items: {$ref: '#/components/schemas/Id'}}
        - name: tags
          in: cookie
          schema: {type: array, items: {$ref: '#/components/schemas/Id'}}
        - name: "{field-name}"
          in: query
          required: false
          schema:
            type: string
        # Common param names that nushell accepts as flags unchanged: builtin
        # command names and keywords are not reserved variable names.
        - name: sort
          in: query
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
        - name: if
          in: query
          schema: {type: string}
        - name: "null"
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  # One name in every place it can collide: the first query `tag` keeps the
  # plain flag; each later spelling takes its group prefix (`--qp-tag`,
  # `--hdr-tag`, `--ck-tag`); a second query spelling after `--qp-tag` gets
  # the numeric sweep (`--qp-tag-2`). Each flag notes its spec name.
  /tagged:
    get:
      operationId: listTagged
      parameters:
        - {name: tag, in: query, schema: {type: string}}
        - {name: "tag[]", in: query, schema: {type: array, items: {type: string}}}
        - {name: Tag, in: query, schema: {type: string}}
        - {name: tag, in: header, schema: {type: string}}
        - {name: tag, in: cookie, schema: {type: string}}
      responses:
        '200': {description: ok}
components:
  schemas:
    Id: {type: string}
