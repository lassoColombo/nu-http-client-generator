              example: 'https://app.asana.com/0/11111111/22222222'
            project:
              allOf:
                - '$ref': '#/components/schemas/ProjectCompact'
                - type: 'object'
                  description: 'The project with which this project brief is associated.'
    ProjectCompact:
      description: 'A *project* represents a prioritized list of tasks in Asana or a board with columns of tasks represented as cards. It exists in a single workspace or organization and is accessible to a subset of users in that workspace or organization, depending on its permissions.'
      type: 'object'
      properties:
        gid:
          description: 'Globally unique identifier of the resource, as a string.'
          type: 'string'
          readOnly: true
          example: '12345'
          x-insert-after: false
        resource_type:
          description: 'The base type of this resource.'
          type: 'string'
          readOnly: true
          example: 'project'
          x-insert-after: 'gid'
        name:
          description: 'Name of the project. This is generally a short sentence fragment that fits on a line in the UI for maximum readability. However, it can be longer.'
          type: 'string'
          example: 'Stuff to buy'
    ProjectDuplicateRequest:
      type: 'object'
      required:
        - 'name'
      properties:
        name:
          description: 'The name of the new project.'
          type: 'string'
          example: 'New Project Name'
        team:
          description: 'Sets the team of the new project. If team is not defined, the new project will be in the same team as the the original project.'
          type: 'string'
          example: '12345'
        include:
          description: "A comma-separated list of elements to include when duplicating a project.\nSome elements are automatically included and cannot be excluded,\nwhile others are **optional** and must be explicitly specified in this field.\n\n**Auto-included fields (non-configurable)**\n- Tasks\n- [Project Views](https://asana.com/features/project-management/project-views)\n(i.e., tabs in a project such as List, Board, Dashboard, etc.)\n- [Rules](https://help.asana.com/s/article/rules)\n\n*Note: The Owner of the Rules copied to the new project is the user who performs the API call.\nIf the duplication is performed using a [Service Account](/docs/authentication#/service-account),\nnote that Service Accounts cannot access the UI to modify or pause Rules.\nTo prevent unwanted automation behavior, consider pausing Rules in the source project before duplication —\ntheir active/paused state is preserved in the new project.*\n\n**Optional fields (configurable)**\n- allocations\n- forms\n- members\n- notes\n- permissions\n- task_assignee\n- task_attachments\n- task_dates\n- task_dependencies\n- task_followers\n- task_notes\n- task_projects\n- task_subtasks\n- task_tags\n- task_templates\n- task_type_default"
          type: 'string'
          pattern: '([allocations|forms|members|notes|permissions|task_assignee|task_attachments|task_dates|task_dependencies|task_followers|task_notes|task_projects|task_subtasks|task_tags|task_templates|task_type_default])(,\1)*'
          example:
            - 'allocations,forms,members,notes,permissions,task_assignee,task_attachments,task_dates,task_dependencies,task_followers,task_notes,task_projects,task_subtasks,task_tags,task_templates,task_type_default'
        schedule_dates:
          description: 'A dictionary of options to auto-shift dates. `task_dates` must be included to use this option. Requires `should_skip_weekends` and either `start_on` or `due_on`, but not both.'
          type: 'object'
          properties:
            should_skip_weekends:
              description: '**Required**: Determines if the auto-shifted dates should skip weekends.'
              type: 'boolean'
              example: true
            due_on:
              description: 'Sets the last due date in the duplicated project to the given date. The rest of the due dates will be offset by the same amount as the due dates in the original project.'
              type: 'string'
              example: '2019-05-21'
            start_on:
              description: 'Sets the first start date in the duplicated project to the given date. The rest of the start dates will be offset by the same amount as the start dates in the original project.'
              type: 'string'
              example: '2019-05-21'
    PortfolioDuplicateRequest:
      type: 'object'
      required:
        - 'name'
      properties:
        name:
          description: 'The name of the new portfolio.'
          type: 'string'
          example: 'New Portfolio Name'
        include:
          description: "A comma-separated list of elements to include when duplicating a portfolio.\n\n**Auto-included fields (non-configurable)**\n- Custom field settings\n- Views (tabs)\n\n**Optional fields (configurable)**\n- description\n- members\n- permissions\n- templates\n- rules\n- child_projects\n- child_portfolios"
          type: 'string'
          example:
            - 'description,members,permissions,templates,rules,child_projects,child_portfolios'
    CustomFieldMembershipBase:
      '$ref': '#/components/schemas/CustomFieldMembershipCompact'
    CustomFieldMembershipCompact:
