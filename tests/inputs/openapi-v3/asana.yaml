        approval_status:
          description: 'The desired approval status to transition to. Valid transitions depend on the current status of the timesheet approval status.'
          type: 'string'
          enum:
            - 'submitted'
            - 'draft'
            - 'approved'
            - 'rejected'
          example: 'submitted'
        message:
          description: 'Optional message to include with the transition (e.g., reason for approval or rejection).'
          type: 'string'
          example: 'Approved by manager'
    TimesheetApprovalStatusCompact:
      description: 'A *timesheet approval status* object represents the approval status for a user''s timesheet for a given week. It tracks whether the timesheet is in draft, submitted, approved, or rejected status.'
      type: 'object'
      properties:
        gid:
          description: 'Globally unique identifier of the resource, as a string.'
          type: 'string'
          readOnly: true
          example: '12345'
          x-insert-after: false
        resource_type:
          description: 'The base type of this resource.'
          type: 'string'
          readOnly: true
          example: 'timesheet_approval_status'
          x-insert-after: 'gid'
        created_at:
          description: 'The time at which this resource was created.'
          type: 'string'
          format: 'date-time'
          readOnly: true
          example: '2012-02-22T02:06:58.147Z'
        user:
          '$ref': '#/components/schemas/UserCompact'
          description: 'The user whose timesheet this approval status is for.'
          readOnly: true
        workspace:
          '$ref': '#/components/schemas/WorkspaceCompact'
          description: 'The workspace in which the timesheet approval status exists.'
          readOnly: true
        start_date:
          description: 'The start date of the timesheet week.'
          type: 'string'
          format: 'date'
          readOnly: true
          example: '2025-01-06'
        end_date:
          description: 'The end date of the timesheet week.'
          type: 'string'
          format: 'date'
          readOnly: true
          example: '2025-01-12'
        approval_status:
          description: 'The current approval status of the timesheet.'
          type: 'string'
          readOnly: true
          enum:
            - 'DRAFT'
            - 'SUBMITTED'
            - 'APPROVED'
            - 'REJECTED'
          example: 'DRAFT'
    TimesheetApprovalStatusResponse:
      allOf:
        - '$ref': '#/components/schemas/TimesheetApprovalStatusCompact'
