              nullable: true
              example: '2012-02-22T02:06:58.147Z'
            completed_by:
              allOf:
                - '$ref': '#/components/schemas/UserCompact'
                - description: 'The user that marked this project complete, or null if the project is not completed.'
                  readOnly: true
                  nullable: true
            followers:
