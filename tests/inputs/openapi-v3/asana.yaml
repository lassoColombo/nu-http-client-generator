              description: 'An object where each key is the GID of a custom field and its corresponding value is either an enum GID, string, number, or object (depending on the custom field type). See the [custom fields guide](/docs/custom-fields-guide) for details on creating and updating custom field values.'
              type: 'object'
              additionalProperties:
                type: 'string'
                description: '"{custom_field_gid}" => Value (can be text, enum GID, a number, etc.). For date, use format "YYYY-MM-DD" (e.g., 2019-09-15). For date-time, use ISO 8601 date string in UTC (e.g., 2019-09-15T02:06:58.147Z).'
              example:
                '5678904321': 'On Hold'
                '4578152156': 'Not Started'
    UserBaseResponse:
      allOf:
        - '$ref': '#/components/schemas/UserBase'
        - type: 'object'
          properties:
            email:
              type: 'string'
              format: 'email'
              readOnly: true
              description: 'The user''s email address.'
              example: 'gsanchez@example.com'
            photo:
              type: 'object'
              nullable: true
              properties:
                image_21x21:
                  type: 'string'
                  format: 'uri'
                  description: 'PNG image of the user at 21x21 pixels.'
                image_27x27:
                  type: 'string'
                  format: 'uri'
                  description: 'PNG image of the user at 27x27 pixels.'
                image_36x36:
                  type: 'string'
                  format: 'uri'
                  description: 'PNG image of the user at 36x36 pixels.'
                image_60x60:
                  type: 'string'
                  format: 'uri'
                  description: 'PNG image of the user at 60x60 pixels.'
                image_128x128:
                  type: 'string'
                  format: 'uri'
                  description: 'PNG image of the user at 128x128 pixels.'
                image_1024x1024:
                  type: 'string'
                  format: 'uri'
                  description: 'JPEG image of the user at 1024x1024 pixels.'
              readOnly: true
              description: 'A map of the user''s profile photo in various sizes, or null if no photo is set. Sizes provided are 21, 27, 36, 60, 128, and 1024. All images are in PNG format, except for 1024 (which is in JPEG format).'
              example:
                image_21x21: 'https://...'
                image_27x27: 'https://...'
                image_36x36: 'https://...'
                image_60x60: 'https://...'
                image_128x128: 'https://...'
                image_1024x1024: 'https://...'
    UserResponse:
      allOf:
        - '$ref': '#/components/schemas/UserBaseResponse'
        - type: 'object'
          properties:
            workspaces:
              description: "Workspaces and organizations this user may access.\nNote\\: The API will only return workspaces and organizations that also contain the authenticated user."
              readOnly: true
              type: 'array'
              items:
                '$ref': '#/components/schemas/WorkspaceCompact'
            custom_fields:
              description: 'Array of Custom Fields.'
              type: 'array'
              items:
                '$ref': '#/components/schemas/CustomFieldCompact'
    UserTaskListBase:
      '$ref': '#/components/schemas/UserTaskListCompact'
    UserTaskListCompact:
      description: 'A user task list represents the tasks assigned to a particular user. It provides API access to a user’s [My tasks](https://asana.com/guide/help/fundamentals/my-tasks) view in Asana.'
      type: 'object'
      properties:
        gid:
          description: 'Globally unique identifier of the resource, as a string.'
          type: 'string'
          readOnly: true
          example: '12345'
          x-insert-after: false
        resource_type:
          description: 'The base type of this resource.'
          type: 'string'
          readOnly: true
          example: 'user_task_list'
          x-insert-after: 'gid'
        name:
          description: 'The name of the user task list.'
          type: 'string'
          example: 'My tasks in My Workspace'
        owner:
          description: 'The owner of the user task list, i.e. the person whose My Tasks is represented by this resource.'
          readOnly: true
          allOf:
            - '$ref': '#/components/schemas/UserCompact'
        workspace:
          description: 'The workspace in which the user task list is located.'
          readOnly: true
          allOf:
            - '$ref': '#/components/schemas/WorkspaceCompact'
    UserTaskListRequest:
      '$ref': '#/components/schemas/UserTaskListBase'
    UserTaskListResponse:
      '$ref': '#/components/schemas/UserTaskListBase'
    WebhookCompact:
      description: 'Webhook objects represent the state of an active subscription for a server to be updated with information from Asana. This schema represents the subscription itself, not the objects that are sent to the server. For information on those please refer to the [event](/reference/events) schema.'
      type: 'object'
      properties:
        gid:
          description: 'Globally unique identifier of the resource, as a string.'
          type: 'string'
          readOnly: true
          example: '12345'
          x-insert-after: false
        resource_type:
          description: 'The base type of this resource.'
          type: 'string'
          readOnly: true
          example: 'webhook'
          x-insert-after: 'gid'
        active:
          description: 'If true, the webhook will send events - if false it is considered inactive and will not generate events.'
          type: 'boolean'
          readOnly: true
          example: false
        resource:
          '$ref': '#/components/schemas/AsanaNamedResource'
        target:
          description: 'The URL to receive the HTTP POST.'
          type: 'string'
          format: 'uri'
          readOnly: true
          example: 'https://example.com/receive-webhook/7654'
    WebhookFilter:
      type: 'object'
      description: 'A WebhookFilter can be passed on creation of a webhook in order to filter the types of actions that trigger delivery of an [event](/reference/events)'
      properties:
        resource_type:
          type: 'string'
          description: 'The type of the resource which created the event when modified; for example, to filter to changes on regular tasks this field should be set to `task`.'
          example: 'task'
        resource_subtype:
          description: 'The resource subtype of the resource that the filter applies to. This should be set to the same value as is returned on the `resource_subtype` field on the resources themselves.'
          type: 'string'
          example: 'milestone'
        action:
          type: 'string'
          description: 'The type of change on the **resource** to pass through the filter. For more information refer to `Event.action` in the [event](/reference/events) schema. This can be one of `changed`, `added`, `removed`, `deleted`, and `undeleted` depending on the nature of what has occurred on the resource.'
          example: 'changed'
        fields:
          type: 'array'
          description: "*Conditional.* A whitelist of fields for events which will pass the filter when the resource is changed. These can be any combination of the fields on the resources themselves. This field is only valid for `action` of type `changed`\n*Note: Subscriptions created on higher-level resources such as a Workspace, Team, or Portfolio do not support fields.*"
          items:
            type: 'string'
          example:
            - 'due_at'
            - 'due_on'
            - 'dependencies'
    WebhookRequest:
      type: 'object'
      properties:
        resource:
          description: 'A resource ID to subscribe to. Many Asana resources are valid to create webhooks on, but higher-level resources require filters.'
          type: 'string'
          example: '12345'
        target:
          description: 'The URL to receive the HTTP POST. The full URL will be used to deliver events from this webhook (including parameters) which allows encoding of application-specific state when the webhook is created.'
          type: 'string'
          format: 'uri'
          example: 'https://example.com/receive-webhook/7654?app_specific_param=app_specific_value'
        filters:
          type: 'array'
          description: 'An array of WebhookFilter objects to specify a whitelist of filters to apply to events from this webhook. If a webhook event passes any of the filters the event will be delivered; otherwise no event will be sent to the receiving server.'
          items:
            allOf:
              - '$ref': '#/components/schemas/WebhookFilter'
              - description: 'A set of filters to specify a whitelist for what types of events will be delivered.'
              - type: 'object'
      required:
        - 'resource'
        - 'target'
    WebhookResponse:
      allOf:
        - '$ref': '#/components/schemas/WebhookCompact'
        - type: 'object'
          properties:
            created_at:
              description: 'The time at which this resource was created.'
              type: 'string'
              format: 'date-time'
              readOnly: true
              example: '2012-02-22T02:06:58.147Z'
            last_failure_at:
              description: 'The timestamp when the webhook last received an error when sending an event to the target.'
              type: 'string'
              format: 'date-time'
              readOnly: true
              example: '2012-02-22T02:06:58.147Z'
            last_failure_content:
              description: 'The contents of the last error response sent to the webhook when attempting to deliver events to the target.'
              type: 'string'
              readOnly: true
              example: '500 Server Error\n\nCould not complete the request'
            last_success_at:
              description: 'The timestamp when the webhook last successfully sent an event to the target.'
              type: 'string'
              format: 'date-time'
              readOnly: true
              example: '2012-02-22T02:06:58.147Z'
            delivery_retry_count:
              description: 'The number of times the webhook has retried delivery of events to the target (resets after a successful attempt).'
              type: 'integer'
              readOnly: true
              example: 3
            next_attempt_after:
              description: 'The timestamp after which the webhook will next attempt to deliver an event to the target.'
              type: 'string'
              format: 'date-time'
              readOnly: true
              example: '2012-02-22T02:06:58.147Z'
            failure_deletion_timestamp:
              description: 'The timestamp when the webhook will be deleted if there is no successful attempt to deliver events to the target'
              type: 'string'
              format: 'date-time'
              readOnly: true
              example: '2012-02-22T02:06:58.147Z'
            filters:
              description: 'Whitelist of filters to apply to events from this webhook. If a webhook event passes any of the filters the event will be delivered; otherwise no event will be sent to the receiving server.'
              type: 'array'
              items:
                allOf:
                  - '$ref': '#/components/schemas/WebhookFilter'
                  - description: 'A set of filters to specify a whitelist for what types of events will be delivered.'
                  - type: 'object'
    WebhookUpdateRequest:
      type: 'object'
      properties:
        filters:
          type: 'array'
          description: 'An array of WebhookFilter objects to specify a whitelist of filters to apply to events from this webhook. If a webhook event passes any of the filters the event will be delivered; otherwise no event will be sent to the receiving server.'
          items:
            allOf:
              - '$ref': '#/components/schemas/WebhookFilter'
              - description: 'A set of filters to specify a whitelist for what types of events will be delivered.'
              - type: 'object'
    WorkspaceAddUserRequest:
      type: 'object'
      description: 'A user identification object for specification with the addUser/removeUser endpoints.'
      properties:
        user:
          description: 'A string identifying a user. This can either be the string "me", an email, or the gid of a user.'
          type: 'string'
          example: '12345'
    WorkspaceBase:
      '$ref': '#/components/schemas/WorkspaceCompact'
    WorkspaceCompact:
      description: 'A *workspace* is the highest-level organizational unit in Asana. All projects and tasks have an associated workspace.'
      type: 'object'
      properties:
        gid:
          description: 'Globally unique identifier of the resource, as a string.'
          type: 'string'
          readOnly: true
          example: '12345'
          x-insert-after: false
        resource_type:
          description: 'The base type of this resource.'
          type: 'string'
          readOnly: true
          example: 'workspace'
          x-insert-after: 'gid'
        name:
          description: 'The name of the workspace.'
          type: 'string'
          example: 'My Company Workspace'
    WorkspaceMembershipBase:
      '$ref': '#/components/schemas/WorkspaceMembershipCompact'
    WorkspaceMembershipCompact:
      description: 'This object determines if a user is a member of a workspace.'
      type: 'object'
      properties:
        gid:
          description: 'Globally unique identifier of the resource, as a string.'
          type: 'string'
          readOnly: true
          example: '12345'
          x-insert-after: false
        resource_type:
          description: 'The base type of this resource.'
          type: 'string'
          readOnly: true
          example: 'workspace_membership'
          x-insert-after: 'gid'
        user:
          '$ref': '#/components/schemas/UserCompact'
        workspace:
          '$ref': '#/components/schemas/WorkspaceCompact'
    WorkspaceMembershipRequest:
      '$ref': '#/components/schemas/WorkspaceMembershipBase'
    WorkspaceMembershipResponse:
      allOf:
        - '$ref': '#/components/schemas/WorkspaceMembershipBase'
        - type: 'object'
          properties:
            user_task_list:
              '$ref': '#/components/schemas/UserTaskListResponse'
              description: 'The user''s "My tasks" in the workspace.'
              readOnly: true
            is_active:
              type: 'boolean'
              readOnly: true
              description: 'Indicates whether the user is currently associated with the workspace. Returns `true` for users who have joined the workspace or have been invited but not yet accepted.'
            is_admin:
              type: 'boolean'
              readOnly: true
              description: 'Reflects if this user is an admin of the workspace.'
            is_guest:
              type: 'boolean'
              readOnly: true
              description: 'Reflects if this user is a guest of the workspace.'
            is_view_only:
              type: 'boolean'
              readOnly: true
              description: 'Reflects if this user has view only license in the workspace.'
            vacation_dates:
              type: 'object'
              readOnly: true
              nullable: true
              deprecated: true
              description: '*Deprecated:* Use the [`/ooo_entries`](/reference/getoooentries) endpoints instead. Contains keys `start_on` and `end_on` for the vacation dates for the user in this workspace. If `start_on` is null, the entire `vacation_dates` object will be null. If `end_on` is before today, the entire `vacation_dates` object will be null.'
              properties:
                start_on:
                  description: '*Deprecated:* Use the [`/ooo_entries`](/reference/getoooentries) endpoints instead. The day on which the user''s vacation in this workspace starts. This is a date with `YYYY-MM-DD` format.'
                  type: 'string'
                  deprecated: true
                  example: '2022-11-05'
                end_on:
                  description: '*Deprecated:* Use the [`/ooo_entries`](/reference/getoooentries) endpoints instead. The day on which the user''s vacation in this workspace ends, or null if there is no end date. This is a date with `YYYY-MM-DD` format.'
                  nullable: true
                  type: 'string'
                  deprecated: true
                  example: '2022-11-07'
            created_at:
              description: 'The time at which this resource was created.'
              type: 'string'
              format: 'date-time'
              readOnly: true
              example: '2012-02-22T02:06:58.147Z'
    WorkspaceRemoveUserRequest:
      type: 'object'
      description: 'A user identification object for specification with the addUser/removeUser endpoints.'
      properties:
        user:
          description: 'A string identifying a user. This can either be the string "me", an email, or the gid of a user.'
          type: 'string'
          example: '12345'
    WorkspaceRequest:
      '$ref': '#/components/schemas/WorkspaceBase'
    WorkspaceResponse:
      allOf:
        - '$ref': '#/components/schemas/WorkspaceBase'
        - type: 'object'
          properties:
            email_domains:
              description: 'The email domains that are associated with this workspace.'
              type: 'array'
              items:
                type: 'string'
                format: 'uri'
              example:
                - 'asana.com'
            is_organization:
              description: 'Whether the workspace is an *organization*.'
              type: 'boolean'
              example: false
    GoalMembershipBase:
      description: 'This object represents a user''s connection to a goal.'
      type: 'object'
      properties:
        gid:
          description: 'Globally unique identifier of the resource, as a string.'
          type: 'string'
          readOnly: true
          example: '12345'
          x-insert-after: false
        resource_type:
          description: 'The base type of this resource.'
          type: 'string'
          example: 'membership'
        resource_subtype:
          type: 'string'
          readOnly: true
          description: 'The type of membership.'
          example: 'goal_membership'
        member:
          '$ref': '#/components/schemas/MemberCompact'
        parent:
          allOf:
            - '$ref': '#/components/schemas/GoalCompact'
            - type: 'object'
              readOnly: true
        role:
          type: 'string'
          description: '*Deprecated: Describes if the member is a commenter or editor in goal.*'
          enum:
            - 'commenter'
            - 'editor'
          deprecated: true
          example: 'editor'
        access_level:
          type: 'string'
          description: '"Describes the membership access level for the goal. This is preferred over role."'
          enum:
            - 'viewer'
            - 'commenter'
            - 'editor'
            - 'admin'
          example: 'editor'
        goal:
          allOf:
            - '$ref': '#/components/schemas/GoalCompact'
            - type: 'object'
              readOnly: true
              deprecated: true
              description: '*Deprecated: new integrations should prefer the `parent` field.* A *Goal* is an object in the goal-tracking system that helps your organization drive measurable results.'
    GoalMembershipCompact:
      allOf:
        - '$ref': '#/components/schemas/GoalMembershipBase'
        - type: 'object'
          properties:
            is_commenter:
              type: 'boolean'
              deprecated: true
              readOnly: true
              description: '*Deprecated: new integrations should prefer the `access_level` field.* Describes if the member is comment only in goal. This field is deprecated and will always be null.'
              example: false
            is_editor:
              type: 'boolean'
              deprecated: true
              readOnly: true
              description: '*Deprecated: new integrations should prefer the `access_level` field.* Describes if the member is editor in goal. This field is deprecated and will always be null.'
              example: false
    GoalMembershipResponse:
      allOf:
        - '$ref': '#/components/schemas/GoalMembershipBase'
        - type: 'object'
          properties:
            user:
              allOf:
                - '$ref': '#/components/schemas/UserCompact'
                - type: 'object'
                  deprecated: true
                  readOnly: true
                  description: '*Deprecated: new integrations should prefer the `member` field.* A *user* object represents an account in Asana that can be given access to various workspaces, projects, and tasks.'
            workspace:
              allOf:
                - '$ref': '#/components/schemas/WorkspaceCompact'
                - type: 'object'
                  deprecated: true
                  readOnly: true
                  description: '*Deprecated:* A *workspace* is the highest-level organizational unit in Asana. All projects and tasks have an associated workspace.'
    MembershipUpdateRequest:
      type: 'object'
      properties:
        access_level:
          description: 'The role given to the member. Goals can have access levels `editor` or `commenter`. Projects can have access levels `admin`, `editor` or `commenter`. Portfolios can have access levels `admin`, `editor` or `viewer`.'
          type: 'string'
          example: 'editor'
    MembershipRequest:
      type: 'object'
      properties:
        access_level:
          description: 'Sets the access level for the member. Goals can have access levels `viewer`, `commenter`, `editor` or `admin`. Projects can have access levels `admin`, `editor` or `commenter`. Portfolios can have access levels `admin`, `editor` or `viewer`. Custom Fields can have access levels `admin`, `editor` or `user`.'
          type: 'string'
          example: 'editor'
    CreateMembershipRequest:
      allOf:
        - '$ref': '#/components/schemas/MembershipRequest'
        - type: 'object'
          properties:
            member:
              description: 'The gid of the user or team.'
              type: 'string'
              example: 12345
            parent:
              description: 'The gid of the `goal`, `project`, or `portfolio` to add the member to.'
              type: 'string'
              example: '987654'
            role:
              description: '*Deprecated: new integrations should use access_level* The role given to the member. Optional argument, will default to `commenter` for goals and the default project role for projects. Can be `editor` or `commenter` for goals. Can be `admin`,`editor` or `commenter` for projects.'
              type: 'string'
              deprecated: true
              example: 'editor'
    MembershipResponse:
      anyOf:
        - '$ref': '#/components/schemas/GoalMembershipResponse'
        - '$ref': '#/components/schemas/ProjectMembershipCompactResponse'
        - '$ref': '#/components/schemas/PortfolioMembershipResponse'
        - '$ref': '#/components/schemas/CustomFieldMembershipResponse'
        - '$ref': '#/components/schemas/CustomTypeMembershipResponse'
    UpdateTimeTrackingEntryRequest:
