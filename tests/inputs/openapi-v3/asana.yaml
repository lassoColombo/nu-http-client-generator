                  description: 'Controls whether users with this role can download attachments from mobile app'
                  type: 'boolean'
                  example: true
                import_data:
                  description: 'Controls whether users with this role can import data into the domain'
                  type: 'boolean'
                  example: true
                create_global_custom_fields:
                  description: 'Controls whether users with this role can create global custom fields'
                  type: 'boolean'
                  example: true
                upload_attachments:
                  description: 'Controls whether users with this role can upload attachments'
                  type: 'boolean'
                  example: true
