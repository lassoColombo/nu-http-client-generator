openapi: '3.0.3'
info:
  title: 'anacleto'
  version: '0.0.0'
  description: 'Anacleto API for Continuous Vulnerability Assessment (CVA) management'
paths:
  /api/carpet/v1/active_idrs/:
    post:
      operationId: 'api_carpet_v1_active_idrs_create'
      summary: 'Get active IDRS list'
      tags:
        - 'Carpet'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          description: 'No response body'
  '/api/carpet/v1/asset_list/idrs/{IDRS}/':
    get:
      operationId: 'api_carpet_v1_asset_list_idrs_list'
      summary: 'Get asset list for customer'
      parameters:
        - in: 'path'
          name: 'IDRS'
          schema:
            type: 'string'
            pattern: '^[^/]+$'
          required: true
        - name: 'ordering'
          required: false
          in: 'query'
          description: 'Which field to use when ordering the results.'
          schema:
            type: 'string'
        - name: 'page'
          required: false
          in: 'query'
          description: 'A page number within the paginated result set.'
          schema:
            type: 'integer'
        - name: 'per_page'
          required: false
          in: 'query'
          description: 'Number of results to return per page.'
          schema:
            type: 'integer'
        - name: 'search'
          required: false
          in: 'query'
          description: 'A search term.'
          schema:
            type: 'string'
      tags:
        - 'Carpet'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/PaginatedHostList'
          description: ''
  '/api/carpet/v1/host/idrs/{IDRS}/':
    get:
      operationId: 'api_carpet_v1_host_idrs_retrieve'
      summary: 'Get host vulnerabilities for customer'
      parameters:
        - in: 'path'
          name: 'IDRS'
          schema:
            type: 'string'
            pattern: '^[^/]+$'
          required: true
      tags:
        - 'Carpet'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          description: 'No response body'
  '/api/delivery/v1/apikeys/idrs/{IDRS}/':
    get:
      operationId: 'api_delivery_v1_apikeys_idrs_retrieve'
      summary: 'Return customer api key'
      parameters:
        - in: 'path'
          name: 'IDRS'
          schema:
            type: 'string'
            pattern: '^[^/]+$'
          required: true
      tags:
        - 'API Keys'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          description: 'No response body'
  /api/delivery/v1/asset/:
    get:
      operationId: 'api_delivery_v1_asset_list'
      summary: 'Asset list'
      parameters:
        - in: 'query'
          name: 'address'
          schema:
            type: 'string'
        - in: 'query'
          name: 'idrs'
          schema:
            type: 'string'
          description: 'IDRS'
        - in: 'query'
          name: 'is_active'
          schema:
            type: 'boolean'
        - in: 'query'
          name: 'is_public'
          schema:
            type: 'boolean'
        - in: 'query'
          name: 'is_scannable'
          schema:
            type: 'boolean'
        - in: 'query'
          name: 'name'
          schema:
            type: 'string'
        - name: 'ordering'
          required: false
          in: 'query'
          description: 'Which field to use when ordering the results.'
          schema:
            type: 'string'
        - name: 'page'
          required: false
          in: 'query'
          description: 'A page number within the paginated result set.'
          schema:
            type: 'integer'
        - name: 'per_page'
          required: false
          in: 'query'
          description: 'Number of results to return per page.'
          schema:
            type: 'integer'
        - in: 'query'
          name: 'scanner_name'
          schema:
            type: 'string'
        - name: 'search'
          required: false
          in: 'query'
          description: 'A search term.'
          schema:
            type: 'string'
        - in: 'query'
          name: 'tag'
          schema:
            type: 'string'
          description: 'Tag'
        - in: 'query'
          name: 'type'
          schema:
            type: 'array'
            items:
              type: 'string'
              x-spec-enum-id: 'ae4a435707be3114'
              enum:
                - 'CI'
                - 'CUSTOM'
                - 'DEFAULT'
                - 'HOSTNAME'
                - 'NETWORK'
          description: "* `CI` - CI\n* `NETWORK` - NETWORK\n* `CUSTOM` - CUSTOM\n* `DEFAULT` - DEFAULT\n* `HOSTNAME` - HOSTNAME"
          explode: true
          style: 'form'
      tags:
        - 'Asset'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/PaginatedAssetListList'
          description: ''
  /api/delivery/v1/asset-tag/create/:
    post:
      operationId: 'api_delivery_v1_asset_tag_create_create'
      summary: 'Add new asset tag'
      tags:
        - 'Asset Tag'
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AssetTagCreate'
          application/x-www-form-urlencoded:
            schema:
              '$ref': '#/components/schemas/AssetTagCreate'
          multipart/form-data:
            schema:
              '$ref': '#/components/schemas/AssetTagCreate'
        required: true
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AssetTagCreate'
          description: ''
  '/api/delivery/v1/asset-tag/delete/{id}/':
    delete:
      operationId: 'api_delivery_v1_asset_tag_delete_destroy'
      summary: 'Delete asset tag'
      parameters:
        - in: 'path'
          name: 'id'
          schema:
            type: 'string'
            pattern: '^\d+$'
          required: true
      tags:
        - 'Asset Tag'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '204':
          description: 'No response body'
  '/api/delivery/v1/asset-tag/edit/{id}/':
    put:
      operationId: 'api_delivery_v1_asset_tag_edit_update'
      summary: 'Edit asset tag'
      parameters:
        - in: 'path'
          name: 'id'
          schema:
            type: 'string'
            pattern: '^\d+$'
          required: true
      tags:
        - 'Asset Tag'
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AssetTagEdit'
          application/x-www-form-urlencoded:
            schema:
              '$ref': '#/components/schemas/AssetTagEdit'
          multipart/form-data:
            schema:
              '$ref': '#/components/schemas/AssetTagEdit'
        required: true
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AssetTagEdit'
          description: ''
  '/api/delivery/v1/asset-tag/idrs/{IDRS}/':
    get:
      operationId: 'api_delivery_v1_asset_tag_idrs_list'
      summary: 'Get asset Tag for Customer'
      parameters:
        - in: 'path'
          name: 'IDRS'
          schema:
            type: 'string'
            pattern: '^[^/]+$'
          required: true
        - name: 'ordering'
          required: false
          in: 'query'
          description: 'Which field to use when ordering the results.'
          schema:
            type: 'string'
        - name: 'page'
          required: false
          in: 'query'
          description: 'A page number within the paginated result set.'
          schema:
            type: 'integer'
        - name: 'per_page'
          required: false
          in: 'query'
          description: 'Number of results to return per page.'
          schema:
            type: 'integer'
        - name: 'search'
          required: false
          in: 'query'
          description: 'A search term.'
          schema:
            type: 'string'
      tags:
        - 'Asset Tag'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/PaginatedAssetTagList'
          description: ''
  /api/delivery/v1/asset/create/:
    post:
      operationId: 'api_delivery_v1_asset_create_create'
      summary: 'Add new asset'
      tags:
        - 'Asset'
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AssetCreation'
          application/x-www-form-urlencoded:
            schema:
              '$ref': '#/components/schemas/AssetCreation'
          multipart/form-data:
            schema:
              '$ref': '#/components/schemas/AssetCreation'
        required: true
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AssetCreation'
          description: ''
  '/api/delivery/v1/asset/deactivate/{id}/':
    post:
      operationId: 'api_delivery_v1_asset_deactivate_create'
      summary: 'Deactivate asset'
      parameters:
        - in: 'path'
          name: 'id'
          schema:
            type: 'string'
            pattern: '^\d+$'
          required: true
      tags:
        - 'Asset'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          description: 'No response body'
  '/api/delivery/v1/asset/delete/{id}/':
    delete:
      operationId: 'api_delivery_v1_asset_delete_destroy'
      summary: 'Delete asset'
      parameters:
        - in: 'path'
          name: 'id'
          schema:
            type: 'string'
            pattern: '^\d+$'
          required: true
      tags:
        - 'Asset'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '204':
          description: 'No response body'
  '/api/delivery/v1/asset/details/{id}/':
    get:
      operationId: 'api_delivery_v1_asset_details_retrieve'
      summary: 'Get asset attribute'
      parameters:
        - in: 'path'
          name: 'id'
          schema:
            type: 'string'
            pattern: '^\d+$'
          required: true
      tags:
        - 'Asset'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AssetDetails'
          description: ''
    put:
      operationId: 'api_delivery_v1_asset_details_update'
      summary: 'Edit asset attribute'
      parameters:
        - in: 'path'
          name: 'id'
          schema:
            type: 'string'
            pattern: '^\d+$'
          required: true
      tags:
        - 'Asset'
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AssetDetails'
          application/x-www-form-urlencoded:
            schema:
              '$ref': '#/components/schemas/AssetDetails'
          multipart/form-data:
            schema:
              '$ref': '#/components/schemas/AssetDetails'
        required: true
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AssetDetails'
          description: ''
  '/api/delivery/v1/asset/idrs/{IDRS}/':
    get:
      operationId: 'api_delivery_v1_asset_idrs_list'
      summary: 'Get asset for Customer'
      parameters:
        - in: 'path'
          name: 'IDRS'
          schema:
            type: 'string'
            pattern: '^[^/]+$'
          required: true
        - name: 'ordering'
          required: false
          in: 'query'
          description: 'Which field to use when ordering the results.'
          schema:
            type: 'string'
        - name: 'page'
          required: false
          in: 'query'
          description: 'A page number within the paginated result set.'
          schema:
            type: 'integer'
        - name: 'per_page'
          required: false
          in: 'query'
          description: 'Number of results to return per page.'
          schema:
            type: 'integer'
        - name: 'search'
          required: false
          in: 'query'
          description: 'A search term.'
          schema:
            type: 'string'
      tags:
        - 'Asset'
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/PaginatedAssetOptionsList'
          description: ''
  '/api/delivery/v1/asset/whitelist/{id}/':
    post:
      operationId: 'api_delivery_v1_asset_whitelist_create'
      summary: 'Add whitelist for the asset'
      parameters:
        - in: 'path'
          name: 'id'
          schema:
            type: 'string'
            pattern: '^\d+$'
          required: true
      tags:
        - 'Asset'
      requestBody:
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/AssetWhitelist'
          application/x-www-form-urlencoded:
            schema:
              '$ref': '#/components/schemas/AssetWhitelist'
          multipart/form-data:
            schema:
              '$ref': '#/components/schemas/AssetWhitelist'
        required: true
      security:
        - ElmecOIDC: []
        - ElmecServiceOIDC: []
        - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AssetWhitelist'
          description: ''
components:
  schemas:
    ActiveVulnerabilities:
      type: 'object'
      properties:
        plugin_name:
          type: 'string'
        cvss:
          type: 'number'
          format: 'double'
        severity:
          enum:
            - 4
            - 3
            - 2
            - 1
            - 0
          type: 'integer'
          description: "* `4` - CRITICAL\n* `3` - HIGH\n* `2` - MEDIUM\n* `1` - LOW\n* `0` - INFO"
          x-spec-enum-id: '0746085f695ff3fd'
          minimum: 0
          maximum: 32767
        severity_label:
          type: 'string'
        host:
          type: 'string'
        ip:
          type: 'string'
        exploit_available:
          type: 'boolean'
        plugin_family_name:
          type: 'string'
        first_seen:
          type: 'string'
          format: 'date-time'
        last_seen:
          type: 'string'
          format: 'date-time'
      required:
        - 'cvss'
        - 'exploit_available'
        - 'first_seen'
        - 'host'
        - 'ip'
        - 'last_seen'
        - 'plugin_family_name'
        - 'plugin_name'
        - 'severity'
        - 'severity_label'
    Asset:
      type: 'object'
      properties:
        tenable_id:
          type: 'array'
          items: {}
        ip:
          type: 'string'
        atlantis_id:
          type: 'string'
        has_vulns:
          type: 'boolean'
        total:
          type: 'string'
        vulns:
          type: 'object'
          additionalProperties: {}
      required:
        - 'atlantis_id'
        - 'has_vulns'
        - 'ip'
        - 'tenable_id'
        - 'total'
        - 'vulns'
    AssetCreation:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        idrs:
          type: 'string'
        name:
          type: 'string'
        is_scannable:
          type: 'boolean'
        scanner_id:
          type: 'integer'
        type:
          enum:
            - 'HOSTNAME'
            - 'CUSTOM'
          type: 'string'
          description: "* `HOSTNAME` - HOSTNAME\n* `CUSTOM` - CUSTOM"
          x-spec-enum-id: '0609b99c00db8baf'
        address:
          type: 'array'
          items: {}
        tag_id:
          type: 'integer'
          nullable: true
      required:
        - 'address'
        - 'id'
        - 'idrs'
        - 'is_scannable'
        - 'name'
        - 'scanner_id'
        - 'type'
    AssetDetails:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        idrs:
          type: 'string'
          readOnly: true
        name:
          type: 'string'
        is_scannable:
          type: 'boolean'
        is_public:
          type: 'boolean'
          readOnly: true
        location:
          type: 'string'
          readOnly: true
        atlantis_id:
          type: 'integer'
          maximum: 2147483647
          minimum: 0
          nullable: true
        is_active:
          type: 'boolean'
        type:
          enum:
            - 'HOSTNAME'
            - 'CUSTOM'
            - 'CI'
            - 'NETWORK'
          type: 'string'
          description: "* `HOSTNAME` - HOSTNAME\n* `CUSTOM` - CUSTOM\n* `CI` - CI\n* `NETWORK` - NETWORK"
          x-spec-enum-id: '9e55db32fe79b640'
        address:
          type: 'array'
          items: {}
        has_whitelist:
          type: 'string'
          readOnly: true
        whitelist:
          type: 'string'
          readOnly: true
        scanner_name:
          type: 'string'
          readOnly: true
        scanner_id:
          type: 'integer'
        number_of_host:
          type: 'string'
          readOnly: true
        error:
          type: 'string'
          nullable: true
          maxLength: 1000
        tag:
          type: 'string'
          readOnly: true
        tag_id:
          type: 'integer'
          nullable: true
      required:
        - 'address'
        - 'has_whitelist'
        - 'id'
        - 'idrs'
        - 'is_public'
        - 'is_scannable'
        - 'location'
        - 'name'
        - 'number_of_host'
        - 'scanner_id'
        - 'scanner_name'
        - 'tag'
        - 'type'
        - 'whitelist'
    AssetList:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        idrs:
          type: 'string'
          readOnly: true
        name:
          type: 'string'
        is_scannable:
          type: 'string'
          readOnly: true
        scanner_name:
          type: 'string'
          readOnly: true
        is_public:
          type: 'boolean'
        is_active:
          type: 'boolean'
          readOnly: true
        location:
          type: 'string'
          readOnly: true
        type:
          type: 'string'
        address:
          type: 'array'
          items: {}
        has_whitelist:
          type: 'string'
          readOnly: true
        error:
          type: 'string'
          nullable: true
          maxLength: 1000
        tag:
          type: 'string'
          readOnly: true
      required:
        - 'address'
        - 'has_whitelist'
        - 'id'
        - 'idrs'
        - 'is_active'
        - 'is_scannable'
        - 'location'
        - 'name'
        - 'scanner_name'
        - 'tag'
        - 'type'
    AssetOptions:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        name:
          type: 'string'
      required:
        - 'id'
        - 'name'
    AssetTag:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        name:
          type: 'string'
      required:
        - 'id'
        - 'name'
    AssetTagCreate:
      type: 'object'
      properties:
        idrs:
          type: 'string'
        name:
          type: 'string'
      required:
        - 'idrs'
        - 'name'
    AssetTagEdit:
      type: 'object'
      properties:
        name:
          type: 'string'
      required:
        - 'name'
    AssetWhitelist:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        ips:
          type: 'array'
          items: {}
        creation_comment:
          enum:
            - 'Under decommissioning'
            - 'Risk transferred'
            - 'Risk accepted'
          type: 'string'
          description: "* `Under decommissioning` - Under decommissioning\n* `Risk transferred` - Risk transferred\n* `Risk accepted` - Risk accepted"
          x-spec-enum-id: '5cfbc3ef5b04f3c7'
        expiration_date:
          type: 'string'
          format: 'date'
        description:
          type: 'string'
      required:
        - 'creation_comment'
        - 'id'
        - 'ips'
    Customer:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        idrs:
          type: 'string'
          maxLength: 64
        is_cva_activated:
          type: 'boolean'
        licenses:
          type: 'integer'
          maximum: 32767
          minimum: 0
          nullable: true
        is_cva_ticket_activated:
          type: 'boolean'
        is_cva_report_activated:
          type: 'boolean'
        total_vulns:
          type: 'string'
          readOnly: true
        scanned_ip:
          type: 'string'
          readOnly: true
        tenable_instance:
          type: 'string'
          readOnly: true
        tenable_instance_url:
          type: 'string'
          readOnly: true
        report_conf:
          type: 'integer'
          nullable: true
        ticket_conf:
          type: 'integer'
          nullable: true
      required:
        - 'id'
        - 'idrs'
        - 'scanned_ip'
        - 'tenable_instance'
        - 'tenable_instance_url'
        - 'total_vulns'
    CustomerCreate:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        idrs:
          type: 'string'
        licenses:
          type: 'integer'
          maximum: 5000
          minimum: 1
        is_spot:
          type: 'boolean'
      required:
        - 'id'
        - 'idrs'
        - 'is_spot'
        - 'licenses'
    CustomerDetails:
      type: 'object'
      properties:
        id:
          type: 'integer'
          readOnly: true
        idrs:
          type: 'string'
          readOnly: true
        licenses:
          type: 'integer'
          maximum: 5000
          minimum: 1
        freeze_window:
          type: 'string'
          readOnly: true
        is_cva_activated:
          type: 'boolean'
        is_cva_ticket_activated:
          type: 'boolean'
        is_cva_report_activated:
          type: 'boolean'
        total_vulns:
          type: 'string'
          readOnly: true
        scanned_ip:
          type: 'string'
          readOnly: true
        report_conf:
          type: 'integer'
          nullable: true
        ticket_conf:
          type: 'integer'
          nullable: true
        tenable_instance:
          type: 'string'
          readOnly: true
        tenable_instance_url:
          type: 'string'
          readOnly: true
        is_spot:
          type: 'boolean'
      required:
        - 'freeze_window'
        - 'id'
        - 'idrs'
        - 'is_cva_activated'
        - 'is_cva_report_activated'
        - 'is_cva_ticket_activated'
        - 'licenses'
        - 'scanned_ip'
        - 'tenable_instance'
        - 'tenable_instance_url'
        - 'total_vulns'
