openapi: 3.0.3
info:
  title: Reserved Name Edge Cases
  version: 1.0.0
servers:
  - url: https://example.com/api
paths:
  /search:
    get:
      operationId: searchByEnv
      tags: [search]
      parameters:
        - name: env
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ok
  /things/{in}:
    get:
      operationId: getThingByIn
      tags: [things]
      parameters:
        - name: in
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
  /envs/{env}:
    get:
      operationId: getEnvByName
      tags: [envs]
      parameters:
        - name: env
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
  /jobs:
    post:
      operationId: createJob
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryRun, raw, baseUrl]
              properties:
                dryRun:
                  type: boolean
                raw:
                  type: string
                baseUrl:
                  type: string
                token:
                  type: string
                accept:
                  type: string
      responses:
        '200':
          description: ok
  # Path params named like the body-code internals (`let input = $in`,
  # `let base = ...`) get `_arg`: without it the positional is shadowed before
  # the URL is built — `input` fails as "must be non-empty" and `base` would
  # silently substitute the base URL.
  /jobs/{input}/{base}:
    post:
      operationId: runJob
      tags: [jobs]
      parameters:
        - name: input
          in: path
          required: true
          schema:
            type: string
        - name: base
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sort:
                  type: string
                str:
                  type: string
      responses:
        '200':
          description: ok
