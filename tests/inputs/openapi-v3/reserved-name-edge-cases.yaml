openapi: 3.0.3
info:
  title: Reserved Name Edge Cases
  version: 1.0.0
servers:
  - url: https://example.com/api
paths:
  /search:
    get:
      operationId: searchByEnv
      tags: [search]
      parameters:
        - name: env
          in: query
          required: false
          schema:
            type: string
        # `in` and `env` are the builtin variables a flag may not bind; both
        # take the group prefix (`--qp-in`, `--qp-env`).
        - name: in
          in: query
          required: false
          schema:
            type: string
        # Enum params named like the module's fixed completers get numbered
        # completers (`base-url-completer-1`), not a second definition.
        - name: baseUrl
          in: query
          schema:
            type: string
            enum: [eu, us]
        - name: authScheme
          in: query
          schema:
            type: string
            enum: [plain, signed]
      responses:
        '200':
          description: ok
  /things/{in}:
    get:
      operationId: getThingByIn
      tags: [things]
      parameters:
        - name: in
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
  /envs/{env}:
    get:
      operationId: getEnvByName
      tags: [envs]
      parameters:
        - name: env
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
  /jobs:
    post:
      operationId: createJob
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryRun, raw, baseUrl]
              properties:
                dryRun:
                  type: boolean
                raw:
                  type: string
                baseUrl:
                  type: string
                token:
                  type: string
                accept:
                  type: string
      responses:
        '200':
          description: ok
  # Path params named `input` and `base` keep their names: a command body is
  # one `http-request` call that binds no variables, so nothing shadows them
  # (only the builtin variables `in` and `env`, above, take `_arg`).
  /jobs/{input}/{base}:
    post:
      operationId: runJob
      tags: [jobs]
      parameters:
        - name: input
          in: path
          required: true
          schema:
            type: string
        - name: base
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sort:
                  type: string
                str:
                  type: string
      responses:
        '200':
          description: ok
