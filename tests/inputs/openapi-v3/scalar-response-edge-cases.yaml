openapi: 3.0.3
info:
  title: Scalar Response Edge Cases
  version: 1.0.0
  description: >-
    Response typing. A client is lenient about what it receives: the signature
    declares only the response's shape (`oneof<record, string, nothing>` for an
    object, `oneof<list<any>, record, string, nothing>` for an array, `any` for
    a scalar or no schema), because nushell checks the declared output type
    when a result is bound with `let`, and a real API's null or missing field
    must not fail the call. The documented type (`record<id: int, …>`, `int`)
    goes into the `Returns:` help line and the `commands` table instead.
    Scalars (string, integer, boolean, text/plain), an object, an array of
    objects and a schemaless response.
servers:
  - url: https://api.example.com
paths:
  # scalar responses -> `any`, documented as `Returns: string` / `int` / `bool`
  /token:
    get:
      operationId: getToken
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: string}
  /count:
    get:
      operationId: getCount
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: integer}
  /healthy:
    get:
      operationId: getHealthy
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: boolean}
  # object response -> oneof<record, string, nothing>, documented as record<id: int, name: string>
  /profile:
    get:
      operationId: getProfile
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  name: {type: string}
  # no response schema -> `any`, no Returns line
  /ping:
    get:
      operationId: getPing
      responses:
        '200': {description: ok}
  # text/plain scalar response (no application/json media): still documented
  # as `Returns: string`, via the non-JSON media fallback.
  /etag:
    get:
      operationId: getEtag
      responses:
        '200':
          description: ok
          content:
            text/plain:
              schema: {type: string}
  # array of objects -> oneof<list<any>, record, string, nothing>, documented as table<id: int, name: string>
  /profiles:
    get:
      operationId: listProfiles
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    name: {type: string}
