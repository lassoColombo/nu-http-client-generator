openapi: 3.0.3
info:
  title: Query Style Edge Cases
  version: 1.0.0
  description: >-
    Synthetic spec exercising OpenAPI 3 query-parameter serialization styles for
    array/object params (form+explode, form+no-explode, spaceDelimited,
    pipeDelimited, deepObject) plus boolean tri-state flags and values that
    require percent-encoding.
servers:
  - url: https://api.example.com
paths:
  /search:
    get:
      operationId: search
      parameters:
        # form + explode (default): tags=a&tags=b
        - name: tags
          in: query
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
        # form + no explode: ids=1,2,3
        - name: ids
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        # spaceDelimited: fields=a%20b%20c
        - name: fields
          in: query
          schema: {type: array, items: {type: string}}
          style: spaceDelimited
          explode: false
        # pipeDelimited: cols=a|b|c
        - name: cols
          in: query
          schema: {type: array, items: {type: string}}
          style: pipeDelimited
          explode: false
        # deepObject: filter[key]=val
        - name: filter
          in: query
          schema: {type: object, additionalProperties: {type: string}}
          style: deepObject
          explode: true
        # form + explode object (the OAS default for objects): a=1&b=2
        - name: opts
          in: query
          schema: {type: object, additionalProperties: {type: string}}
          style: form
          explode: true
        # form + no-explode object: range=min,1,max,9
        - name: range
          in: query
          schema: {type: object, additionalProperties: {type: integer}}
          style: form
          explode: false
        # spaceDelimited object: dims=w%20100%20h%2050 (OAS 3 §4.8.12.4),
        # not the deepObject `dims[w]=100` it used to fall through to.
        - name: dims
          in: query
          schema: {type: object, additionalProperties: {type: integer}}
          style: spaceDelimited
          explode: false
        # pipeDelimited object: bounds=lo|1|hi|9
        - name: bounds
          in: query
          schema: {type: object, additionalProperties: {type: integer}}
          style: pipeDelimited
          explode: false
        # boolean query -> oneof<nothing, bool>
        - name: verbose
          in: query
          schema: {type: boolean}
        # value needing percent-encoding (key & value)
        - name: q
          in: query
          schema: {type: string}
          description: A free-text query that may contain reserved chars (&, =, /).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: object}
