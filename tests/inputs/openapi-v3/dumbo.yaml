openapi: 3.0.3
info:
  title: dumbo
  version: 0.2.0
  description: The project that manages the configuration of the dmilog and the services
    running on it
paths:
  /api/v1/cloud-init/:
    post:
      operationId: api_v1_cloud_init_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudInit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CloudInit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CloudInit'
        required: true
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudInit'
          description: ''
  /api/v1/dmilog/:
    get:
      operationId: api_v1_dmilog_list
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
      - in: query
        name: domain
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: private_ip
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: vpn_ip
        schema:
          type: string
      tags:
      - api
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DmilogCFG'
          description: ''
  /api/v1/dmilog/{name}/:
    get:
      operationId: api_v1_dmilog_retrieve
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmilogCFG'
          description: ''
    put:
      operationId: api_v1_dmilog_update
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DmilogCFGUpsert'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DmilogCFGUpsert'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DmilogCFGUpsert'
        required: true
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmilogCFGUpsert'
          description: ''
  /api/v1/hooks/chart:
    post:
      operationId: api_v1_hooks_chart_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartVersionHook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChartVersionHook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChartVersionHook'
        required: true
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartVersionHook'
          description: ''
  /api/v1/hooks/dmilog:
    post:
      operationId: api_v1_hooks_dmilog_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DmilogCfgHook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DmilogCfgHook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DmilogCfgHook'
        required: true
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmilogCfgHook'
          description: ''
  /api/v1/jobs/{queue_name}/{job_id}/:
    get:
      operationId: api_v1_jobs_retrieve
      description: |-
        Generic endpoint to retrieve status of any RQ job
        given queue name + job id.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      - in: path
        name: queue_name
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          description: No response body
  /api/v1/me/permissions/services:
    get:
      operationId: api_v1_me_permissions_services_retrieve
      tags:
      - api
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          description: No response body
  /api/v1/services/:
    get:
      operationId: api_v1_services_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
          description: ''
  /status:
    get:
      operationId: status_retrieve
      tags:
      - status
      security:
      - ElmecOIDC: []
      - ElmecServiceOIDC: []
      - ElmecStaticToken: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    ChartVersionHook:
      type: object
      properties:
        version:
          type: string
        project_id:
          type: integer
      required:
      - project_id
      - version
    CloudInit:
      type: object
      properties:
        networkType:
          enum:
          - dhcp
          - static
          type: string
          description: |-
            * `dhcp` - dhcp
            * `static` - static
          x-spec-enum-id: d328e454cd4e5f61
        otpVpn:
          type: string
        ipAddress:
          type: string
        gateway:
          type: string
        primaryDns:
          type: string
        secondaryDns:
          type: string
      required:
      - networkType
      - otpVpn
    DmilogCFG:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        atl_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        idrs:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 128
        domain:
          type: string
          nullable: true
          maxLength: 128
        public_domain:
          type: string
          nullable: true
          maxLength: 128
        private_ip:
          type: string
          nullable: true
        vpn_ip:
          type: string
          nullable: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
      required:
      - atl_id
      - id
      - idrs
      - name
      - services
    DmilogCFGUpsert:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        activate:
          type: array
          items:
            type: string
        deactivate:
          type: array
          items:
            type: string
        commit_message:
          type: string
          maxLength: 4096
      required:
      - commit_message
      - name
    DmilogCfgHook:
      type: object
      properties:
        sha:
          type: string
          maxLength: 45
        project_id:
          type: integer
        commit_message:
          type: string
          maxLength: 4096
      required:
      - commit_message
      - project_id
      - sha
    Service:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          enum:
          - fluentd
          - falconConnector
          - pegasus
          - nessusScanner
          - suricata
          - zeek
          - yzma
          - dioneae
          - rdphoney
          - soldato
          - metrics
          - logging
          - cynetProxy
          - serviceDashboard
          - publicServiceDashboard
          - grafana
          - null
          type: string
          description: |-
            * `fluentd` - Fluentd
            * `falconConnector` - Falconconnector
            * `pegasus` - Pegasus
            * `nessusScanner` - Nessusscanner
            * `suricata` - Suricata
            * `zeek` - Zeek
            * `yzma` - Yzma
            * `dioneae` - Dioneae
            * `rdphoney` - Rdphoney
            * `soldato` - Soldato
            * `metrics` - Metrics
            * `logging` - Logging
            * `cynetProxy` - Cynetproxy
            * `serviceDashboard` - Servicedashboard
            * `publicServiceDashboard` - Publicservicedashboard
            * `grafana` - Grafana
          x-spec-enum-id: fe29b3d88a409527
          nullable: true
        category:
          enum:
          - logsCollector
          - scanner
          - networkTrafficAnalysis
          - siem
          - canary
          - monitoring
          - utility
          - null
          type: string
          description: |-
            * `logsCollector` - Logscollector
            * `scanner` - Scanner
            * `networkTrafficAnalysis` - Networktrafficanalysis
            * `siem` - Siem
            * `canary` - Canary
            * `monitoring` - Monitoring
            * `utility` - Utility
          x-spec-enum-id: fadcd84ea31b4e07
          nullable: true
      required:
      - id
  securitySchemes:
    ElmecOIDC:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "JWT"
    ElmecServiceOIDC:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ElmecStaticToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "STATIC"
servers:
- url: https://dumbo.k8s.elmec.ad
  description: dumbo production server
